name: "NixVim Config Check"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,nixpkgs-python

      - name: Check Flake
        run: nix flake check

      - name: Auto-merge automated update PRs
        if: github.event_name == 'pull_request' && github.head_ref == 'update_flake_lock_action'
        run: gh pr merge "${{ github.event.pull_request.number }}" --rebase
        env:
          GH_TOKEN: ${{ github.token }}
