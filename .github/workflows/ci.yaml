name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only the bot's own pull request needs this, and it is minted early so
      # the auto-merge step at the end of this job can use it: enabling
      # auto-merge needs a token with write access, which the App provides.
      - name: Generate GitHub App token
        id: app-token
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'update_flake_lock_action')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # upstream Nix, not Determinate Nix (no OIDC/vendor login)
          determinate: "false"
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,nixpkgs-python

      - name: Check Flake
        run: nix flake check

      # `nix flake check` builds the configs on main and same-repo PRs; the
      # results are pushed so other machines pull instead of rebuilding.
      # Fork PRs have no CACHIX_AUTH_TOKEN, so they skip the push.
      # Paths already served by a substituter are not uploaded.
      - name: Push nixvim closures missing from substituters
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths .#default .#mini > "$RUNNER_TEMP/outs.txt"
          nix path-info -r $(cat "$RUNNER_TEMP/outs.txt") | sort -u > "$RUNNER_TEMP/closure.txt"
          echo "==> Closure paths: $(wc -l < "$RUNNER_TEMP/closure.txt")"

          # Upload only what no substitute already serves. Probing is plain HTTP
          # on purpose: one `nix path-info` per path costs ~1 s of startup plus a
          # cold narinfo round trip in CI, which turned 997 paths into 30 min.
          substituters="https://cache.nixos.org https://nix-community.cachix.org https://niri.cachix.org https://nixpkgs-python.cachix.org"
          export substituters
          served() {
            local h=${1##*/} base code attempt
            h=${h%%-*}
            for base in $substituters; do
              for attempt in 1 2 3; do
                code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$base/$h.narinfo")
                [ "$code" = 000 ] || break
                sleep 1
              done
              case "$code" in
                200) return 0 ;;
                404) continue ;;
                *)
                  # Inconclusive (rate limit, outage): assume it is cached, so a
                  # flaky substituter never turns into a pointless upload.
                  echo "::notice title=probe inconclusive::$base answered $code for $1" >&2
                  return 0
                  ;;
              esac
            done
            return 1
          }
          export -f served
          if ! timeout 300 xargs -P 16 -I{} bash -c 'served "$1" || echo "$1"' _ {} \
            < "$RUNNER_TEMP/closure.txt" > "$RUNNER_TEMP/missing.txt"; then
            echo "::warning title=probe incomplete::falling back to pushing the whole closure"
            cp "$RUNNER_TEMP/closure.txt" "$RUNNER_TEMP/missing.txt"
          fi
          echo "==> Missing from every substituter: $(wc -l < "$RUNNER_TEMP/missing.txt")"
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            cachix push w1ngd1nga5ter < "$RUNNER_TEMP/missing.txt"
          fi

      # Auto-merge, scoped to this bot's own pull request: the guard below is
      # what keeps it off human PRs, because this step lives in the `check` job
      # that runs for every pull request.
      #
      # `--auto`, not an immediate merge: this very job *is* the required `check`
      # context, so an immediate merge would be rejected while this run is still
      # in progress. Deferred auto-merge fires once the run reports success.
      #
      # The App token is load-bearing. `update-flake-lock` pushes this branch and
      # opens the pull request; with the default GITHUB_TOKEN the push triggers
      # no workflows, so no check run ever appears on the pull request head and
      # auto-merge would wait forever.
      - name: Enable auto-merge on the update pull request
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'update_flake_lock_action')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          if [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "auto-merge is already enabled for #$pr"
            exit 0
          fi
          gh pr merge "$pr" --auto --rebase

  cache:
    # Serialised after check so the shared nixpkgs closure is realised once
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # upstream Nix, not Determinate Nix (no OIDC/vendor login)
          determinate: "false"
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,nixpkgs-python

      - name: Build packages and push closure to Cachix
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json | jq -r '.[]')
          installables=()
          for p in "${pkgs[@]}"; do
            installables+=(".#packages.x86_64-linux.$p")
          done
          echo "==> Building: ${installables[*]}"
          nix build --no-link "${installables[@]}"
          nix path-info "${installables[@]}" | cachix push w1ngd1nga5ter
