name: "Update Flake Lock"

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 everday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # upstream Nix, not Determinate Nix (no OIDC/vendor login)
          determinate: "false"
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,nixpkgs-python

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "chore(deps): update flake.lock"
          pr-labels: |
            dependencies
            automated
          commit-msg: "chore(deps): update flake.lock"

      - name: Checkout the PR branch
        if: ${{ steps.update.outputs.pull-request-number }}
        uses: actions/checkout@v7
        with:
          ref: update_flake_lock_action
          token: ${{ github.token }}
          persist-credentials: false

      - name: Build nixvim and push closure to Cachix
        if: ${{ steps.update.outputs.pull-request-number }}
        run: |
          drv=$(nix build --print-out-paths . --no-link)
          nix-store --query --requisites "$drv" | cachix push w1ngd1nga5ter
