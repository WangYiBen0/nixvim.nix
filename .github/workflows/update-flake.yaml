name: "Update Flake Lock"

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 everday
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri,nixpkgs-python

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(deps): update flake.lock"
          pr-labels: |
            dependencies
            automated
          commit-msg: "chore(deps): update flake.lock"

      - name: Checkout the PR branch as myself (with PAT)
        if: ${{ steps.update.outputs.pull-request-number }}
        uses: actions/checkout@v7
        with:
          ref: update_flake_lock_action
          token: ${{ secrets.UPDATE_TOKEN }}

      - name: Build nixvim and push closure to Cachix
        if: ${{ steps.update.outputs.pull-request-number }}
        run: |
          drv=$(nix build --print-out-paths . --no-link)
          nix-store --query --requisites "$drv" | cachix push w1ngd1nga5ter

      - name: Amend commit with human committer; ensure CI will run
        if: ${{ steps.update.outputs.pull-request-number }}
        run: git commit --amend --no-edit

      - name: Force push changes to CI branch
        if: ${{ steps.update.outputs.pull-request-number }}
        run: git push origin update_flake_lock_action --force
